name: Vocoder
options:
  bundleIdPrefix: com.vocoder
  deploymentTarget:
    iOS: "17.0"

packages:
  CIVocoderKit:
    path: ../CIVocoderKit

targets:
  Vocoder:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: CIVocoderKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vocoder.app
        PRODUCT_NAME: Vocoder
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Vocoder
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Vocoder uses the microphone to record a short clip you can hear processed through the cochlear-implant simulation."

  VocoderTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: VocoderTests
    dependencies:
      - target: Vocoder
      - package: CIVocoderKit
    settings:
      base:
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Vocoder:
    build:
      targets:
        Vocoder: all
        VocoderTests: [test]
    test:
      targets:
        - VocoderTests
    run:
      config: Debug
